<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Font Picker</title>
  <style>
    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-elev: #21262d;
      --accent: #e94560;
      --accent-soft: rgba(233, 69, 96, 0.12);
      --success: #3fb950;
      --border: #30363d;
      --text: #e6edf3;
      --text-dim: #8b949e;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; }
    body { display: flex; flex-direction: column; }
    .toolbar { padding: 12px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: center; background: var(--bg-card); }
    .search { flex: 1; padding: 8px 12px; background: var(--bg-elev); color: var(--text); border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
    .search:focus { outline: none; border-color: var(--accent); }
    .filter { padding: 8px; background: var(--bg-elev); color: var(--text); border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }
    .tabs { display: flex; gap: 4px; padding: 0 12px; background: var(--bg-card); border-bottom: 1px solid var(--border); }
    .tab { padding: 10px 16px; cursor: pointer; color: var(--text-dim); border-bottom: 2px solid transparent; font-size: 14px; }
    .tab.active { color: var(--text); border-bottom-color: var(--accent); }
    .tab .count { background: var(--bg-elev); padding: 1px 6px; border-radius: 8px; font-size: 11px; margin-left: 4px; }
    .main { flex: 1; overflow-y: auto; padding: 12px; }
    .font-list { display: grid; gap: 8px; }
    .font-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; display: flex; align-items: center; gap: 12px; }
    .font-card .info { flex: 1; min-width: 0; }
    .font-card .family { font-size: 16px; font-weight: 600; }
    .font-card .meta { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
    .font-card .preview { font-size: 22px; color: var(--text); margin-top: 4px; }
    .font-card .actions { display: flex; gap: 6px; flex-shrink: 0; }
    .btn { padding: 8px 14px; border: 1px solid var(--border); background: var(--bg-elev); color: var(--text); border-radius: 6px; cursor: pointer; font-size: 13px; }
    .btn:hover { background: var(--accent-soft); border-color: var(--accent); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: white; }
    .btn.primary:hover { filter: brightness(1.1); }
    .btn.installed { background: transparent; color: var(--success); border-color: var(--success); cursor: default; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .weights { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
    .weight-chip { padding: 2px 6px; background: var(--bg-elev); border-radius: 3px; font-size: 11px; color: var(--text-dim); border: 1px solid transparent; }
    .weight-chip.selected { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
    .weight-chip:hover { cursor: pointer; }

    .btn.danger { color: #f87171; border-color: #f87171; background: transparent; }
    .btn.danger:hover { background: rgba(248, 113, 113, 0.12); border-color: #f87171; }
    .btn.danger:disabled { opacity: 0.4; }
    .weight-label { display: inline-block; padding: 1px 6px; background: var(--bg-elev); border-radius: 3px; font-size: 11px; color: var(--text-dim); margin-left: 6px; font-weight: normal; vertical-align: middle; }
    .family-header { display: flex; align-items: center; justify-content: space-between; padding: 6px 4px 2px; font-size: 13px; color: var(--text-dim); }
    .family-header .delete-family { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 11px; padding: 2px 6px; border-radius: 3px; }
    .family-header .delete-family:hover { color: #f87171; background: rgba(248, 113, 113, 0.08); }
    .weight-cards { display: grid; gap: 6px; margin-bottom: 8px; }
    .empty { text-align: center; padding: 40px; color: var(--text-dim); }
    .error { padding: 16px; background: rgba(248, 113, 113, 0.1); border: 1px solid #f87171; border-radius: 6px; color: #f87171; margin: 12px 0; }
    .loading { text-align: center; padding: 40px; color: var(--text-dim); }

    .preview-banner { padding: 8px 12px; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 6px; color: var(--text); font-size: 12px; margin: 0 0 8px 0; }

    /* Font cards whose cached woff2 was rejected by the browser's
       font sanitizer (e.g. Exile's empty-gid glyf table). The
       picker can't preview these -- the browser falls back to
       sans-serif automatically -- so we mark the card with a
       warning border and replace the meta line with a clear
       "upstream issue" message instead of letting the user
       wonder why every card looks the same. */
    .font-card.broken { opacity: 0.7; border-style: dashed; border-color: var(--warn, #d4a017); }
    .meta-broken { color: var(--warn, #d4a017); font-style: italic; }
    .picked-bar { padding: 10px 12px; background: var(--bg-card); border-top: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
    .picked-bar .picked-name { flex: 1; color: var(--text-dim); font-size: 13px; }
    .picked-bar .picked-name strong { color: var(--text); }
  </style>
</head>
<body>
  <div class="toolbar">
    <input type="text" class="search" id="search" placeholder="Search Google Fonts...">
    <select class="filter" id="category-filter">
      <option value="">All categories</option>
      <option value="sans-serif">Sans Serif</option>
      <option value="serif">Serif</option>
      <option value="display">Display</option>
      <option value="monospace">Monospace</option>
      <option value="handwriting">Handwriting</option>
    </select>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="google">Google Fonts <span class="count" id="google-count">…</span></div>
    <div class="tab" data-tab="installed">Installed <span class="count" id="installed-count">0</span></div>
  </div>

  <div class="main">
    <div id="google-pane" class="font-list"></div>
    <div id="installed-pane" class="font-list" style="display:none"></div>
  </div>

  <div class="picked-bar">
    <div class="picked-name" id="picked-label">No font picked</div>
    <button class="btn" id="use-btn" disabled>Use This Font</button>
  </div>

  <script src="/js/font-picker.js?v=1789357467"></script>

</body>
</html>
