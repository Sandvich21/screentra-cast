<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News Ticker</title>
  <style>
    :root {
      --bg: transparent;
      --text: #e6edf3;
      --accent: #e94560;
    }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #app {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
    }
    #error-banner {
      display: none;
      padding: 1.5vh 2vh;
      background: rgba(233, 69, 96, 0.12);
      border-left: 4px solid var(--accent);
      color: var(--text);
      font-size: 1.6vh;
    }
    #error-banner.visible { display: block; }
    #status {
      position: absolute; bottom: 0.5vh; right: 1vw;
      font-size: 1.2vh; opacity: 0.5;
    }
    .ripley-template-elements-render {
      position: relative; width: 100%; height: 100%;
      overflow: hidden; container-type: inline-size;
    }
    .news-ticker {
      width: 100%; height: 100%;
      display: flex; align-items: center; overflow: hidden;
    }
    .news-ticker-track {
      display: inline-block; padding-left: 100%;
      white-space: nowrap;
      will-change: transform;
    }
    .news-ticker-headline {
      display: inline-block;
      padding-right: 4em;
    }
    .news-ticker-sep {
      display: inline-block;
      opacity: 0.5;
      padding-right: 4em;
    }
    .news-loading {
      position: absolute; inset: 0;
      display: grid; place-items: center;
      color: var(--text); opacity: 0.6;
      font-size: 2vh;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="error-banner"></div>
    <div id="canvas"></div>
    <div id="status">Loading…</div>
  </div>
<script src="/js/news-template.js?v=20261009100211-image-corner-radius"></script>
</body>
</html>
