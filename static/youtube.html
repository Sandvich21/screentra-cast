<!DOCTYPE html>
<html>
<head><meta charset="UTF-8">
<script>
(function () {
  var requested = new URLSearchParams(location.search).get('fit') || 'cover';
  var allowed = ['cover', 'contain', 'fill', 'none', 'scale-down'];
  document.documentElement.dataset.videoFit = allowed.indexOf(requested) >= 0 ? requested : 'cover';
})();
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#000;overflow:hidden;}
/* Keep the YouTube player at its native 16:9 ratio. The previous fixed 178%
   size always cropped the video and ignored the widget's Scaling setting. */
#player{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border:none;background:#000;}
html[data-video-fit="cover"] #player{width:max(100vw,177.7778vh);height:max(100vh,56.25vw);}
html[data-video-fit="contain"] #player{width:min(100vw,177.7778vh);height:min(100vh,56.25vw);}
html[data-video-fit="fill"] #player,
html[data-video-fit="none"] #player,
html[data-video-fit="scale-down"] #player{width:100vw;height:100vh;}
</style>
<style id="ripley-link-guard-style">
.was-link,.ripley-was-link{display:inline-flex;align-items:center;gap:.45em;border:1px dashed rgba(125,211,252,.65);background:rgba(14,116,144,.16);color:#bae6fd;border-radius:999px;padding:.14em .55em;text-decoration:none;cursor:default;}
.was-link::after,.ripley-was-link::after{content:"was link";font-size:.68em;letter-spacing:.08em;text-transform:uppercase;color:#7dd3fc;}
</style>
</head>
<body>
<div id="player"></div>
<script src="/js/youtube.js?v=20261018-youtube-fit-v1"></script>

<script src="/js/ripley-link-guard.js?v=1785288216"></script>
</body>
</html>
