<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#000;overflow:hidden;}
/* 2026-08-11: scale the player 1.78x and center, so the YouTube embed's
   16:9 letterbox falls outside the visible viewport. Without this, the
   player shows thick black bars on any non-16:9 content. */
#player{position:absolute;top:50%;left:50%;width:178vw;height:178vh;transform:translate(-50%,-50%);border:none;background:#000;}
</style>
<style id="ripley-link-guard-style">
.was-link,.ripley-was-link{display:inline-flex;align-items:center;gap:.45em;border:1px dashed rgba(125,211,252,.65);background:rgba(14,116,144,.16);color:#bae6fd;border-radius:999px;padding:.14em .55em;text-decoration:none;cursor:default;}
.was-link::after,.ripley-was-link::after{content:"was link";font-size:.68em;letter-spacing:.08em;text-transform:uppercase;color:#7dd3fc;}
</style>
</head>
<body>
<div id="player"></div>
<script src="/js/youtube.js?v=20261014013236-youtube-fix"></script>

<script src="/js/ripley-link-guard.js?v=1785288216"></script>
</body>
</html>
